<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0b1120" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bg-grad)" stroke="#6366f1" stroke-width="6" />
  
  <!-- Antenna & TV Screen Frame -->
  <rect x="76" y="116" width="360" height="280" rx="36" fill="#020617" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.4" />
  
  <!-- Glowing Play Arrow in Center -->
  <polygon points="216,196 336,256 216,316" fill="url(#glow-grad)" filter="url(#glow)" />
  <polygon points="216,196 336,256 216,316" fill="#ffffff" opacity="0.9" />

  <!-- Live Pulse Dot -->
  <circle cx="396" cy="156" r="10" fill="#f43f5e" />
  <circle cx="396" cy="156" r="18" fill="none" stroke="#f43f5e" stroke-width="3" opacity="0.6" />
</svg>
